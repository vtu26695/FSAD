<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Campus Event Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1>🎓 Smart Campus Events</h1>
                <p>Manage and discover campus events efficiently</p>
            </div>
            <div class="user-profile">
                <button class="profile-btn" id="profileBtn">
                    <span class="user-avatar" id="userAvatar">U</span>
                </button>
                <div class="profile-dropdown" id="profileDropdown">
                    <div class="profile-info">
                        <div class="profile-name" id="userName">User Name</div>
                        <div class="profile-email" id="userEmail">user@example.com</div>
                        <div class="profile-student-id" id="studentIdDisplay">Loading...</div>
                    </div>
                    <button class="profile-logout" id="logoutBtn">Logout</button>
                </div>
            </div>
        </header>

        <main class="main-content">
            <aside class="sidebar">
                <nav class="nav-menu">
                    <button class="nav-btn active" data-filter="all">
                        <span class="icon">📅</span> All Events
                    </button>
                    <button class="nav-btn" data-filter="academic">
                        <span class="icon">📚</span> Academic
                    </button>
                    <button class="nav-btn" data-filter="sports">
                        <span class="icon">⚽</span> Sports
                    </button>
                    <button class="nav-btn" data-filter="cultural">
                        <span class="icon">🎭</span> Cultural
                    </button>
                    <button class="nav-btn" data-filter="social">
                        <span class="icon">👥</span> Social
                    </button>
                </nav>
                <div class="sidebar-footer">
                    <p class="event-count">Total Events: <span id="eventCount">0</span></p>
                </div>
            </aside>

            <section class="content-area">
                <div class="control-panel">
                    <div class="search-box">
                        <input type="text" id="searchInput" class="search-input" placeholder="Search events...">
                        <button class="search-btn">🔍</button>
                    </div>
                    <button id="addEventBtn" class="btn btn-primary">+ Create Event</button>
                </div>

                <div class="events-container" id="eventsContainer">
                    <div class="empty-state">
                        <p>📭 No events found. Create one to get started!</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="eventModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Create New Event</h2>
                <button class="close-btn">&times;</button>
            </div>
            <form id="eventForm" class="event-form">
                <div class="form-group">
                    <label for="eventTitle">Event Title *</label>
                    <input type="text" id="eventTitle" class="form-input" placeholder="Enter event title" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="eventDate">Date *</label>
                        <input type="date" id="eventDate" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label for="eventTime">Time *</label>
                        <input type="time" id="eventTime" class="form-input" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="eventLocation">Location *</label>
                    <input type="text" id="eventLocation" class="form-input" placeholder="Event location" required>
                </div>

                <div class="form-group">
                    <label for="eventCategory">Category *</label>
                    <select id="eventCategory" class="form-input" required>
                        <option value="">Select a category</option>
                        <option value="academic">Academic</option>
                        <option value="sports">Sports</option>
                        <option value="cultural">Cultural</option>
                        <option value="social">Social</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="eventDescription">Description</label>
                    <textarea id="eventDescription" class="form-input" placeholder="Event description" rows="4"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="eventCapacity">Capacity</label>
                        <input type="number" id="eventCapacity" class="form-input" placeholder="Max participants" min="1">
                    </div>
                    <div class="form-group">
                        <label for="eventOrganizer">Organizer</label>
                        <input type="text" id="eventOrganizer" class="form-input" placeholder="Organizer name">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Event</button>
                </div>
            </form>
        </div>
    </div>

    <div id="detailsModal" class="modal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2 id="detailsTitle">Event Details</h2>
                <button class="close-btn">&times;</button>
            </div>
            <div class="details-content" id="detailsContent"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="detailsCloseBtn">Close</button>
                <button class="btn btn-primary" id="registerBtn">Register</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="auth.js"></script>
    <script src="script.js"></script>

</body>
</html>
